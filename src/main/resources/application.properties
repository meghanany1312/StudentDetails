spring.application.name=demo
server.servlet.context-path= /api
# Enable the web-based H2 Console interface
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database Connection Settings (In-Memory Database named 'mydb')
spring.datasource.url=jdbc:h2:mem:mydb
spring.datasource.driver-class-name=org.h2.Driver

# Create your custom Username and Password here
spring.datasource.username=myCustomUser
spring.datasource.password=mySecretPassword

# Hibernate Dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
